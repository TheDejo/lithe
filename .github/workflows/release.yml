name: Release

# Publishes to npm when a version tag (e.g. v0.2.0) is pushed,
# or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Test
        run: npm test

      # Authenticates via npm trusted publishing: no token or secret needed.
      # Configure once on npmjs.com: package Settings -> Trusted Publisher ->
      # GitHub Actions, user "TheDejo", repo "lithe", workflow "release.yml".
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
