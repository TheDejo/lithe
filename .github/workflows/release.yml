name: Release

# Publishes to npm when a version tag (e.g. v0.2.0) is pushed,
# or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      # No registry-url here on purpose: that makes setup-node write a
      # placeholder auth token, which npm falls back to (and fails with a
      # misleading 404) if trusted publishing can't authenticate.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Check OIDC token is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::No OIDC token available. The job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC token available; npm $(npm -v)"

      # Authenticates via npm trusted publishing: no token or secret needed.
      # Configure once on npmjs.com: package Settings -> Trusted Publisher ->
      # GitHub Actions, user "TheDejo", repo "lithe", workflow "release.yml",
      # with "Allow npm publish" ticked.
      - name: Publish to npm
        run: npm publish --access public --loglevel verbose

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
